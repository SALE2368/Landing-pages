<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - Palais du Chocolat</title>
    <link rel="stylesheet" href="cafe.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html">Retour à l'accueil</a>
        <h1>Créer un compte</h1>
    </header>

    <main>
        <form class="user-form" method="post">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" autocomplete="family-name" required>

            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" autocomplete="given-name" required>

            <label for="date-naissance">Date de naissance</label>
            <input type="date" id="date-naissance" name="date-naissance" required>

            <label for="lieu-naissance">Lieu de naissance</label>
            <input type="text" id="lieu-naissance" name="lieu-naissance" required>

            <label for="ville">Ville</label>
            <input type="text" id="ville" name="ville" autocomplete="address-level2" required>

            <label for="code-postal">Code postal</label>
            <input type="text" id="code-postal" name="code-postal" autocomplete="postal-code" required>

            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="telephone">Numéro de téléphone</label>
            <input type="tel" id="telephone" name="telephone" autocomplete="tel" required>

            <p>Pour enregistrer ces informations, ce formulaire doit être relié à un serveur.</p>
            <button type="submit">Créer mon compte</button>
        </form>
    </main>
</body>
</html>
